<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/moonlit.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (() => {
      const root = document.documentElement;
      let mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      let snapshot;
      try {
        snapshot = JSON.parse(localStorage.getItem('moonlit-appearance-boot-v1'));
        if (snapshot?.version === 1 && ['light', 'dark'].includes(snapshot.mode)) mode = snapshot.mode;
      } catch { /* Keep system preference when storage is unavailable. */ }
      const profile = snapshot?.version === 1 ? snapshot[mode] : null;
      const validHex = value => typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value);
      root.setAttribute('data-moonlit-color-scheme', mode);
      root.style.colorScheme = mode;
      root.style.backgroundColor = validHex(profile?.surface) ? profile.surface : mode === 'dark' ? '#000000' : '#FCFCFC';
      root.style.color = validHex(profile?.ink) ? profile.ink : mode === 'dark' ? '#EDEDED' : '#0D0D0D';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400&family=Geist+Mono:wght@400&family=Inter:wght@400&display=swap"
    rel="stylesheet">
  <title>Moonlit</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
