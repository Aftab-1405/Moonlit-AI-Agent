[project]
name = "moonlit-backend"
version = "2.0.0"
description = "MOONLIT — AI Agent for relational databases (audited, bank-grade)."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35.0",
  "cachetools>=5.3.0",
  "fastapi>=0.109.0,<1.0.0",
  "firebase-admin>=6.2.0,<7.0.0",
  "google-auth>=2.29.0,<3.0.0",
  "google-cloud-firestore>=2.16.0,<3.0.0",
  "gunicorn>=22.0.0,<24.0.0",
  "huggingface-hub>=0.26.0",
  "langchain-aws>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-tavily>=0.1.0",
  "langgraph>=1.1.0",
  "langgraph-checkpoint>=2.0.0",
  "langgraph-checkpoint-redis>=0.1.0",
  "mistral-common>=1.5.0",
  "mysql-connector-python>=9.1.0,<10.0.0",
  "oracledb>=2.0.0",
  "psycopg2-binary>=2.9.0,<3.0.0",
  "pydantic>=2.0.0,<3.0.0",
  "pyjwt>=2.8.0,<3.0.0",
  "pymssql>=2.3.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "python-multipart>=0.0.6",
  "qdrant-client>=1.12.0,<2.0.0",
  "redis>=5.0.0,<6.0.0",
  "redisvl>=0.20.0,<1.0.0",
  "requests>=2.28.0,<3.0.0",
  "safetensors>=0.4.0",
  "sentencepiece>=0.2.0",
  "slowapi>=0.1.9,<1.0.0",
  "sqlglot>=20.0.0",
  "starlette>=0.37.0,<2.0.0",
  "tiktoken>=0.7.0",
  "tokenizers>=0.22.0",
  "transformers>=4.46.0",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.27.0,<1.0.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "limits>=3.7.0,<6.0.0",
  "mypy>=1.13.0,<2.0.0",
  "pip-audit>=2.9.0,<3.0.0",
  "pytest>=9.0.0,<10.0.0",
  "pytest-asyncio>=1.0.0,<2.0.0",
  "ruff>=0.15.0,<0.16.0",
]

[tool.uv]
required-version = "==0.12.5"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
# E402 is intentionally relaxed: several modules set ``Config = get_config()``
# before importing submodules that depend on the config singleton at import
# time. Reordering would change evaluation semantics.
#
# E501 is relaxed: the codebase contains long string literals (SQL templates,
# docstrings, URLs) that cannot be auto-broken. Structural formatting is
# enforced by `ruff format`; line-length is a soft target, not a hard rule.
ignore = ["E402", "E501"]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests that require external services (Firestore, Qdrant, Bedrock)",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
